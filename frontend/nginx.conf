# Serves the built portal and forwards API calls, so the browser talks to one origin (no CORS needed).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads (KYC documents, POD photos) are up to 10 MB.
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    # Hashed build files never change, so browsers may keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a portal page: let React Router handle it.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# Builds and tests ProCargo on every push and pull request:
#   database  – installs the tables and stored procedures on a real SQL Server
#   backend   – builds the .NET 10 solution and runs the unit, integration and SQL Server tests
#   frontend  – type-checks and builds the React portal
name: CI

on:
  push:
    branches: [main, 'refactor/**']
    paths: ['backend/**', 'database/**', 'frontend/**', '.github/workflows/ci.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: 'Ci_Passw0rd!2026'
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - name: Start SQL Server
        run: |
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
            -p 1433:1433 -v "$GITHUB_WORKSPACE/database:/database:ro" \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is up"; exit 0
            fi
            sleep 2
          done
          docker logs sql; exit 1

      - name: Install database (tables + stored procedures)
        run: |
          docker exec -w /database sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -I -b -i install-all.sql

      - name: Re-run the procedures (they must be safe to run twice)
        run: |
          for f in database/procedures/*.sql; do
            docker exec -w /database sql /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$SA_PASSWORD" -C -I -b -i "procedures/$(basename "$f")"
          done

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Restore
        working-directory: backend
        run: dotnet restore ProCargo.sln

      - name: Build
        working-directory: backend
        run: dotnet build ProCargo.sln --no-restore -c Release -warnaserror:false

      - name: Test
        working-directory: backend
        env:
          PROCARGO_TEST_SQL: "Server=localhost,1433;Database=ProCargo;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True"
        run: dotnet test ProCargo.sln --no-build -c Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      - name: Report failed tests as annotations
        if: failure()
        working-directory: backend
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          files = glob.glob('tests/**/TestResults/*.trx', recursive=True)
          if not files:
              print('::error title=No test results::dotnet test produced no .trx files (build or startup failure)')
          for f in files:
              root = ET.parse(f).getroot()
              for r in root.iterfind('.//t:UnitTestResult', ns):
                  if r.get('outcome') != 'Failed':
                      continue
                  msg = (r.findtext('.//t:Message', '', ns) + ' | ' + r.findtext('.//t:StackTrace', '', ns)[:500])
                  msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::error title={r.get('testName')}::{msg[:1500]}")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: backend/tests/**/TestResults/*.trx

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  # The whole business through the built portal, the real API and SQL Server (Playwright, Chromium).
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: 'Ci_Passw0rd!2026'
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - name: Start SQL Server and install the database
        run: |
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
            -p 1433:1433 -v "$GITHUB_WORKSPACE/database:/database:ro" \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec -w /database sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -I -b -i install-all.sql

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Start the API (Development, so sign-in codes are returned)
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Database__ConnectionString: "Server=localhost,1433;Database=ProCargo;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True"
          Jwt__SigningKey: ci-e2e-signing-key-0123456789abcdef0123456789
          Cors__AllowedOrigins__0: http://localhost:4173
          RateLimiting__AuthPermitsPerMinute: '200'
          RateLimiting__RequestsPerMinute: '5000'
        run: |
          dotnet build src/ProCargo.API -c Release
          nohup dotnet run --project src/ProCargo.API -c Release --no-build --urls http://localhost:5080 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5080/health >/dev/null && echo "API is up" && exit 0
            sleep 2
          done
          cat api.log; exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build and serve the portal
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:5080/api/v1
        run: |
          npm install --no-audit --no-fund
          npm run build
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Portal smoke test
        working-directory: frontend
        env:
          PORTAL_URL: http://localhost:4173
          API_URL: http://localhost:5080/api/v1
        run: node e2e/smoke.mjs

      - name: Report API errors
        if: failure()
        working-directory: backend
        run: |
          grep -E "fail:|Exception" -A3 api.log | head -40 | tr '\n' ' ' | sed 's/^/::error title=API log::/' || true

  # The images docker-compose.yml builds.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the API image
        run: docker build -f backend/src/ProCargo.API/Dockerfile -t procargo-api backend
      - name: Build the portal image
        run: docker build -t procargo-portal frontend
      - name: Check the compose file
        run: cp .env.example .env && docker compose config --quiet
